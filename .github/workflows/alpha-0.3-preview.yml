name: Alpha 0.3 Vorschau

on:
  push:
    branches:
      - alpha-0.3
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: alpha-0.3-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hauptversion auschecken
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Alpha 0.2 separat auschecken
        uses: actions/checkout@v4
        with:
          ref: alpha-0.2
          path: alpha-0.2-src

      - name: Alpha 0.3 separat auschecken
        uses: actions/checkout@v4
        with:
          ref: alpha-0.3
          path: alpha-0.3-src

      - name: Vorschau-Verzeichnisse zusammenstellen
        run: |
          mkdir -p site/alpha-0.2 site/alpha-0.3
          cp -a alpha-0.2-src/. site/alpha-0.2/
          cp -a alpha-0.3-src/. site/alpha-0.3/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website-Artefakt erstellen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
